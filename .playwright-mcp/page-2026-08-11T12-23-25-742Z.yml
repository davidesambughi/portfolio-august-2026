            - generic [ref=e78]:
              - 'button "RemoteNIF architecture diagram: browser client, Next.js App Router runtime (proxy, Server Components, Server Actions, Route Handlers, lib/ business logic layer), Supabase Cloud infrastructure, and external services" [ref=e80]':
                - 'img "RemoteNIF architecture diagram: browser client, Next.js App Router runtime (proxy, Server Components, Server Actions, Route Handlers, lib/ business logic layer), Supabase Cloud infrastructure, and external services" [ref=e81]'
              - heading "Architecture" [level=2] [ref=e82]
              - paragraph [ref=e83]: RemoteNIF is built on a full-stack, 5-layer architecture, entirely on Next.js 16 (App Router), with no separate backend.
              - paragraph [ref=e84]:
                - strong [ref=e85]: Proxy
                - text: — Every browser request first passes through
                - code [ref=e86]: "`proxy.ts`"
                - text: ": it verifies the Supabase JWT session, renews it by calling Supabase Auth on every request (refresh token), and handles multilingual routing (4 languages). It's the single entry point for navigation — which is why it talks directly to Supabase Auth, rather than just reading a cookie."
              - paragraph [ref=e87]:
                - strong [ref=e88]: Server Components
                - text: — Read data directly from the database via Drizzle ORM and return HTML already rendered server-side. No client-side data-fetching calls.
              - paragraph [ref=e89]:
                - strong [ref=e90]: Server Actions
                - text: "— Handle all mutations: document uploads, payments, user settings. Invoked directly from React components, without going through public API endpoints — a smaller attack surface."
              - paragraph [ref=e91]:
                - strong [ref=e92]: Route Handlers
                - text: "— Reserved exclusively for events from external systems: Stripe webhooks and cron jobs. They never handle direct browser requests (with one documented exception: the ZIP download, which requires a binary stream that Server Actions can't return)."
              - paragraph [ref=e93]:
                - strong [ref=e94]:
                  - code [ref=e95]: "`lib/`"
                  - text: layer
                - text: "— The architectural center: shared business logic (database queries, sending emails, AI review, PDF generation) called by both Server Actions and Route Handlers. Server Components and Server Actions never contain business logic directly — they delegate all of it here."
              - paragraph [ref=e96]:
                - text: "Rounding out the system, three external services with distinct roles:"
                - strong [ref=e97]: Supabase
                - text: (JWT authentication, PostgreSQL database, file storage — three separate services, not a single block),
                - strong [ref=e98]: Stripe
                - text: for payments,
                - strong [ref=e99]: Resend
                - text: for transactional emails,
                - strong [ref=e100]: Groq
                - text: (Llama 4 Scout) for automatic verification of uploaded documents.
              - paragraph [ref=e101]:
                - text: "Two mechanisms deserve a separate mention because they step outside the standard flow:"
                - strong [ref=e102]: document upload
                - text: connects directly to Supabase Storage via a signed URL — the file never passes through the Next.js server, avoiding memory saturation; the
                - strong [ref=e103]: Stripe webhook
                - text: is instead an inverted flow, where Stripe actively notifies the outcome of the payment, with an HMAC signature verified server-side to guarantee its authenticity.
