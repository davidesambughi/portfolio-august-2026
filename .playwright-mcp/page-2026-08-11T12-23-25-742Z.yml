            - heading "Stripe – Case Study" [level=2] [ref=e142]
            - generic [ref=e143]:
              - generic [ref=e144]:
                - paragraph [ref=e145]:
                  - strong [ref=e146]: Two parallel channels.
                  - text: "On payment, Stripe fires two parallel, independent channels: it redirects the browser to the dashboard and sends a webhook to the server — with no guaranteed order of arrival. The webhook is the only authentic confirmation, verified via HMAC signature and protected by a double idempotency check (application-level + database UNIQUE constraint) against duplicate orders. Meanwhile, a client component polls the server every 2.5s until the order appears, avoiding an empty dashboard."
