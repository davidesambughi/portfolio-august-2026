            - img "RemoteNIF" [ref=e20]
            - paragraph [ref=e21]: RemoteNIF is a full-stack web application, optimized for SEO/GEO (search and generative engine optimization), available in 4 languages (English, Spanish, French and German).
          - generic [ref=e22]:
            - paragraph [ref=e23]: The NIF (Número de Identificação Fiscal) is the Portuguese equivalent of the Italian tax code. It's a number issued by the Portuguese Tax Authority (Autoridade Tributária e Aduaneira, known as Finanças), that uniquely identifies individuals and legal entities. It's required to start working, open a bank account, buy or rent property, and is effectively the first bureaucratic hurdle for any relocation or investment path in Portugal.
            - paragraph [ref=e24]: For non-residents, obtaining it requires delegating the process to a legal representative via a power of attorney, and although the procedure can be completed entirely remotely, the solutions currently on the market are often characterized by fragmented communication, unclear costs, and no real-time tracking of the request.
            - paragraph [ref=e25]:
              - strong [ref=e26]: RemoteNif
              - text: digitizes obtaining the Portuguese NIF for non-residents.
            - paragraph [ref=e27]: Next.js · Supabase · Drizzle ORM · Stripe · Resend · Next-Intl · Zod · Groq · Claude Code · SEO & GEO opt.
            - generic [ref=e29]:
              - generic [ref=e36]:
                - text: Roles —
                - paragraph [ref=e37]: User requests the service, pays, and uploads documents; Admin reviews documents (after AI pre-analysis) and forwards the case; Operator (Portuguese tax representative) handles submission to Finanças.
              - generic [ref=e43]:
                - text: Order state machine —
                - paragraph [ref=e44]: documents_pending → documents_under_review → documents_approved → submitted → delivered — each document has its own lifecycle, decoupled from the order status.
              - generic [ref=e49]:
                - text: EN · ES · FR · DE —
                - paragraph [ref=e50]: Multilingual platform covering the main markets NIF applicants come from.
            - generic [ref=e51]:
              - heading "The end-to-end flow" [level=2] [ref=e52]
              - list [ref=e53]:
                - listitem [ref=e54]:
                  - strong [ref=e55]: Marketing visit
                  - text: ": The user lands on the public homepage and explores the service."
                - listitem [ref=e56]:
                  - strong [ref=e57]: Tier selection
                  - text: ": They choose one of the three pricing tiers based on how urgent their case is."
                - listitem [ref=e58]:
                  - strong [ref=e59]: Account creation
                  - text: ": They register their credentials (email and password). The system sends a verification email via Resend; clicking the link is mandatory before payment, to make sure the delivery email address is active and valid."
                - listitem [ref=e60]:
                  - strong [ref=e61]: Checkout & Payment
                  - text: ": The customer is redirected to a hosted Stripe Checkout session. Once the transaction completes, Stripe notifies the server asynchronously; the order is created in the documents_pending state and the client returns to the dashboard."
                - listitem [ref=e62]:
                  - strong [ref=e63]: Power of Attorney generation
                  - text: ": The customer enters their personal details (name, foreign address) and downloads the automatically generated Power of Attorney as a PDF."
                - listitem [ref=e64]:
                  - strong [ref=e65]: Signature & Upload
                  - text: ": The customer signs the Power of Attorney (printed or digitally) and uploads the three required documents to the dashboard: passport, proof of residence abroad, and the signed Power of Attorney."
                - listitem [ref=e66]:
                  - strong [ref=e67]: Preliminary AI analysis
                  - text: ": For each uploaded file, the backend sends a prompt and the file to Groq (Llama 4 Scout) to extract data and check the document's legibility. The analysis returns one of three outcomes: Clear (approved by the AI), Flagged (the file has legibility or data-consistency issues), or Error (automatic escalation to an admin)."
                - listitem [ref=e68]:
                  - strong [ref=e69]: Admin approval
                  - text: ": The admin reviews the AI-validated files and clicks \"Approve\". The order moves to the documents_approved state, starting the SLA timer for Express plans and adding the order to the operator's queue."
                - listitem [ref=e70]:
                  - strong [ref=e71]: Operator submission
                  - text: ": The operator downloads the ZIP package containing all the documentation, submits it to e-balcão (the Portuguese Finanças portal), and marks the case as submitted."
                - listitem [ref=e72]:
                  - strong [ref=e73]: NIF delivery
                  - text: ": Once the NIF certificate is issued, the admin enters the 9-digit code and uploads the final PDF. The system sends an automatic notification email, sets the order to delivered, and permanently displays the NIF on the customer's dashboard."
