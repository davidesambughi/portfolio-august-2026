            - list [ref=e52]:
              - listitem [ref=e53]:
                - generic [ref=e54]: "Visita marketing:"
                - text: L'utente accede alla homepage pubblica ed esplora il servizio.
              - listitem [ref=e55]:
                - generic [ref=e56]: "Selezione tier:"
                - text: Sceglie una delle tre fasce di prezzo in base all'urgenza della pratica.
              - listitem [ref=e57]:
                - generic [ref=e58]: "Creazione account:"
                - text: Registra le credenziali (email e password). Il sistema invia un'email di verifica tramite Resend; il click sul link è obbligatorio prima del pagamento per garantire che l'email di recapito sia attiva e valida.
              - listitem [ref=e59]:
                - generic [ref=e60]: "Checkout e Pagamento:"
                - text: Il cliente viene reindirizzato alla sessione ospitata di Stripe Checkout. Completata la transazione, Stripe notifica il server asincronamente; l'ordine viene creato in stato documents_pending e il client torna alla dashboard.
              - listitem [ref=e61]:
                - generic [ref=e62]: "Generazione Procura:"
                - text: Il cliente inserisce i dati personali (nome, indirizzo estero) e scarica la Procura generata automaticamente in formato PDF.
              - listitem [ref=e63]:
                - generic [ref=e64]: "Firma e Upload:"
                - text: "Il cliente firma la Procura stampata o digitalmente e carica nella dashboard i tre documenti richiesti: passaporto, prova di residenza all'estero e la Procura firmata."
              - listitem [ref=e65]:
                - generic [ref=e66]: "Analisi AI Preliminare:"
                - text: "Per ogni file caricato, il backend invia un prompt e il file a Groq (Llama 4 Scout) per estrarre dati e verificare la leggibilità del documento. L'analisi restituisce tre esiti possibili: Clear (documento approvato dall'AI), Flagged (il file ha problemi di leggibilità o congruenza dati), o Error (escalation automatica ad admin)."
              - listitem [ref=e67]:
                - generic [ref=e68]: "Approvazione Admin:"
                - text: L'amministratore controlla i file validati dall'AI e preme "Approva". L'ordine passa nello stato documents_approved, attivando il timer SLA per i piani Express e inserendo l'ordine nella coda dell'operatore.
              - listitem [ref=e69]:
                - generic [ref=e70]: "Sottomissione Operatore:"
                - text: L'operatore scarica il pacchetto ZIP contenente tutta la documentazione, la sottomette a e-balcão (il portale di Finanças portoghese) e contrassegna la pratica come submitted.
              - listitem [ref=e71]:
                - generic [ref=e72]: "Consegna NIF:"
                - text: Una volta emesso il certificato NIF, l'amministratore inserisce il codice a 9 cifre e carica il PDF finale. Il sistema invia un'email automatica di notifica, imposta l'ordine a delivered e mostra in modo permanente il NIF sulla dashboard del cliente.
