      - generic [ref=e11]:
        - paragraph [ref=e12]: Il NIF (Número de Identificação Fiscal) è l'equivalente portoghese del codice fiscale italiano. È un codice rilasciato dall'Autorità Tributaria portoghese (Autoridade Tributária e Aduaneira, nota come Finanças), che identifica univocamente persone fisiche e giuridiche. È necessario per iniziare un'attività lavorativa, aprire un conto corrente bancario, acquistare o affittare un immobile, e rappresenta di fatto il primo scoglio burocratico per qualsiasi percorso di trasferimento o investimento in Portogallo.
        - paragraph [ref=e13]: Per i non residenti, ottenerlo richiede di delegare il processo a un rappresentante legale tramite una Procura, e sebbene la procedura possa essere completata interamente da remoto, le soluzioni presenti sul mercato risultano spesso caratterizzate da frammentazione nelle comunicazioni, opacità nei costi e assenza di tracciamento in tempo reale della pratica.
